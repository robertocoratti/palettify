[package]
name = "palettify"
version = "0.2.0"
edition = "2021"
description = "High-performance image color palette mapping API"
authors = ["Roberto Coratti <corattiroberto@gmail.com>"]

[lib]
name = "palettify"
path = "src/lib.rs"

[[bin]]
name = "palettify"
path = "src/main.rs"

[dependencies]
image    = "0.25"
rayon    = "1"

axum          = { version = "0.7", features = ["multipart"] }
tokio         = { version = "1",   features = ["full"] }
tower      = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

thiserror           = "1"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy             = "0.15"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
strip          = true
