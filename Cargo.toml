[package]
name = "palettify"
version = "0.2.0"
edition = "2021"
description = "Image color palette matching API"
authors = ["Roberto Coratti <corattiroberto@gmail.com>"]

[[bin]]
name = "palettify"
path = "src/main.rs"

[dependencies]
# Image decoding/encoding
image = "0.24"

# Parallelism per-pixel processing
rayon = "1"

# HTTP API
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
