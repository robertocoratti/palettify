[workspace]
members  = ["core", "cli"]
resolver = "2"

[workspace.package]
version    = "0.0.1"
edition    = "2021"
authors    = ["Roberto Coratti <corattiroberto@gmail.com>"]
license    = "MIT"
repository = "https://github.com/robertocoratti/palettify"
homepage   = "https://github.com/robertocoratti/palettify"
readme     = "README.md"

[workspace.dependencies]
palettify-core = { path = "core", version = "0.0.1" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
