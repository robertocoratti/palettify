name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BIN: palettify

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl toolchain for native Linux build
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      # cross for ARM Linux
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build -p palettify --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build -p palettify --release --target ${{ matrix.target }}

      # ── Package ──────────────────────────────────────────────────────────────

      - name: Package
        id: package
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ARCHIVE="${BIN}-${VERSION}-${{ matrix.target }}.zip"
            cp "target/${{ matrix.target }}/release/${BIN}.exe" "${BIN}.exe"
            powershell -Command "Compress-Archive -Path '${BIN}.exe' -DestinationPath '${ARCHIVE}'"
          else
            ARCHIVE="${BIN}-${VERSION}-${{ matrix.target }}.tar.gz"
            cp "target/${{ matrix.target }}/release/${BIN}" "${BIN}"
            tar -czf "${ARCHIVE}" "${BIN}"
          fi
          echo "asset=${ARCHIVE}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish palettify-core
        run: |
          out=$(cargo publish -p palettify-core 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "already exists"
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish palettify
        run: |
          out=$(cargo publish -p palettify 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "already exists"
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
