<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feFlood flood-color="#88c0d0" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in" result="shadow"/>
      <feGaussianBlur in="shadow" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0d1117"/>

  <!-- ═══════════════════════════════════════════════════════════
       TOP STRIPS
  ═══════════════════════════════════════════════════════════ -->

  <!-- Strip 1 · Catppuccin Mocha (20 colors × 60px, y=0, h=40) -->
  <rect x="0"    y="0" width="60" height="40" fill="#11111b"/>
  <rect x="60"   y="0" width="60" height="40" fill="#1e1e2e"/>
  <rect x="120"  y="0" width="60" height="40" fill="#181825"/>
