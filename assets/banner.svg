  <!-- ═══════════════════════════════════════════════════════════
       BRANDING  (y=120 → y=280, 160px tall, center y=200)
  ═══════════════════════════════════════════════════════════ -->
  <text x="600" y="200"
        font-family="monospace" font-size="72" font-weight="bold"
        fill="#ffffff" text-anchor="middle"
        filter="url(#glow)">palettify</text>
  <text x="600" y="238"
        font-family="monospace" font-size="17"
        fill="#8b949e" text-anchor="middle">remap any image's colors to a palette</text>

  <!-- ═══════════════════════════════════════════════════════════
       BOTTOM STRIPS
  ═══════════════════════════════════════════════════════════ -->

