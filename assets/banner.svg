  ═══════════════════════════════════════════════════════════ -->
  <rect x="0"    y="0"   width="100" height="120" fill="url(#fadeL)"/>
  <rect x="1100" y="0"   width="100" height="120" fill="url(#fadeR)"/>
  <rect x="0"    y="280" width="100" height="120" fill="url(#fadeL)"/>
  <rect x="1100" y="280" width="100" height="120" fill="url(#fadeR)"/>

